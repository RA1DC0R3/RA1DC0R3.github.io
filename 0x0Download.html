<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>0x0</title>
  <!-- Force download instead of opening -->
  <meta http-equiv="refresh" content="0; url=0x0.html">
  <script>
    // Auto-download trick (works on iPhone, Android, PC)
    const link = document.createElement('a');
    link.href = '0x0.html';
    link.download = '0x0.html';  // forces download
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  </script>
  <style>
    body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding-top:15%}
    h1{font-size:3em;animation:g 1s infinite}
    @keyframes g{0%,100%{opacity:1}50%{opacity:0.3}}
  </style>
</head>
<body>
<h1>0x0 downloading<span>...</span></h1>
<p>If download doesn't start, <a href="0x0.html" style="color:#0f0">click here</a></p>
</body>
</html>
