let currentLeaderboard = ethicalHackerLeaderboard;

function showEthicalHacker() {

  currentPath = ethicalHackerPath;
  updateContent();

  currentPath = scripterPath;

  document.getElementById('btnScripter').classList.add('active');
  document.getElementById('btnEthicalHacker').classList.remove('active');
}

function updateContent() {
  document.getElementById('content').innerHTML = `
  <div class="box">
  <h1>0 x 0<span class="blink">_</span></h1>
  <h2>20 RANKS TO ROOT</h2>

  ${commonParts}`;
}

async function unlock() {
  const input = document.getElementById('pass').value;
  const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

  if (hashHex === correctHash) {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('main').innerHTML = `
    <div id="switcher">
      <button id="btnEthicalHacker" class="active" onclick="showEthicalHacker()">ETHICAL HACKER PATH</button>
      <button id="btnScripter" onclick="showScripter()">SCRIPTER PATH</button>
    </div>
    <div id="content"></div>`;
    document.getElementById('main').style.visibility = 'visible';
    document.getElementById('main').style.opacity = '1';
    updateContent();
  } else {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('denied').style.display = 'flex';
  }
}

document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

// Matrix rain
const c=document.getElementById('m'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const s='01020304050607080910111213141516171819`!@#$%^&*()_+-={}[]|:";<>,./';
const f=16,cols=c.width/f,d=[];
for(let i=0;i<cols;i++)d[i]=1;
function r(){
  x.fillStyle='rgba(0,0,0,0.05)';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#0f0';x.font=f+'px monospace';
  for(let i=0;i<d.length;i++){
    const t=s[Math.floor(Math.random()*s.length)];
    x.fillText(t,i*f,d[i]*f);
    if(d[i]*f>c.height&&Math.random()>0.975)d[i]=0;
    d[i]++;
  }
}
