async function sha1(str){
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function check(){
  const input = document.getElementById('pass').value.trim();
  const hash = await sha1(input);
  if(hash === correctHash){
    document.getElementById('lock').remove();
    document.getElementById('main').innerHTML = atob(encrypted);
    document.getElementById('main').style.visibility = 'visible';
    document.getElementById('main').style.opacity = '1';
  }else{
    document.getElementById('lock').style.display='none';
    document.getElementById('denied').style.display='block';
  }
}

// Enter key
document.getElementById('pass').addEventListener('keydown', e=>{if(e.key==='Enter')check();});

// Matrix rain
const c=document.getElementById('m'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const s='01020304050607080910111213141516171819!@#$%^&*()_+-=`~;'"'|/.,<>[]{};
const f=16,cols=c.width/f,d=[];
for(let i=0;i<cols;i++)d[i]=1;
function r(){
  x.fillStyle='rgba(0,0,0,0.05)';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#0f0';x.font=f+'px monospace';
  for(let i=0;i<d.length;i++){
    const t=s[Math.floor(Math.random()*s.length)];
    x.fillText(t,i*f,d[i]*f);
    if(d[i]*f>c.height&&Math.random()>0.975)d[i]=0;
    d[i]++;
  }
}
