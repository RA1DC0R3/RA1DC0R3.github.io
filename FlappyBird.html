<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #70c5ce;
    }

    canvas {
      display: block;
      background-color: #70c5ce;
    }

    .score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 30px;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      color: white;
      font-family: Arial, sans-serif;
      display: none;
      background-color: #808080;  /* Grey background */
      border: 3px solid black;    /* Black border */
      border-radius: 15px;        /* Curved edges */
      padding: 20px;              /* Padding inside the box */
      text-align: center;         /* Centered text */
    }

    .credit {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 18px;
      color: white;
      font-family: Arial, sans-serif;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="score" class="score">Score: 0</div>
  <div id="gameOver" class="game-over">Game Over! Press Ctrl + R to Restart</div>
  <div class="credit">Made By AD Game Studio</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let canvasWidth, canvasHeight;
    
    function resizeCanvas() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let bird = {
      x: 50,
      y: canvasHeight / 2,
      width: 40,
      height: 40,
      gravity: 0.8,
      lift: -10,
      velocity: 0,
      isJumping: false
    };

    let pipes = [];
    const pipeWidth = 60;
    const pipeGap = 200;
    const pipeSpeed = 2;
    let frame = 0;
    let score = 0;
    let gameOver = false;

    const pipeMinHeight = 50;
    const pipeMaxHeight = canvasHeight - pipeGap - pipeMinHeight;
    const pipeSpacing = 200;

    let highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;

    document.addEventListener('keydown', function (event) {
      if (event.code === 'Space' && !gameOver) {
        bird.velocity = bird.lift;
        bird.isJumping = true;
      }
    });

    function createPipes() {
      let lastPipeX = pipes.length > 0 ? pipes[pipes.length - 1].top.x : canvasWidth;
      const newPipeX = lastPipeX + pipeSpacing;

      const pipeHeight = Math.floor(Math.random() * (pipeMaxHeight - pipeMinHeight)) + pipeMinHeight;
      const pipeTop = { x: newPipeX, y: 0, width: pipeWidth, height: pipeHeight };
      const pipeBottom = { x: newPipeX, y: pipeHeight + pipeGap, width: pipeWidth, height: canvasHeight - pipeHeight - pipeGap };
      pipes.push({ top: pipeTop, bottom: pipeBottom });
    }

    function movePipes() {
      for (let i = 0; i < pipes.length; i++) {
        pipes[i].top.x -= pipeSpeed;
        pipes[i].bottom.x -= pipeSpeed;

        if (pipes[i].top.x + pipeWidth < 0) {
          pipes.splice(i, 1);
          score++;
          i--;
        }
      }
    }

    function detectCollision() {
      for (let i = 0; i < pipes.length; i++) {
        if (
          bird.x + bird.width > pipes[i].top.x &&
          bird.x < pipes[i].top.x + pipeWidth &&
          (bird.y < pipes[i].top.height || bird.y + bird.height > pipes[i].bottom.y)
        ) {
          gameOver = true;
          document.getElementById('gameOver').style.display = 'block';
        }
      }

      if (bird.y + bird.height >= canvasHeight || bird.y <= 0) {
        gameOver = true;
        document.getElementById('gameOver').style.display = 'block';
      }
    }

    function updateBird() {
      if (!gameOver) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        if (bird.y > canvasHeight - bird.height) bird.y = canvasHeight - bird.height;
        if (bird.y < 0) bird.y = 0;
      }
    }

    function drawBird() {
      ctx.fillStyle = '#FFCC00';
      ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

      ctx.fillStyle = '#FFB700';
      ctx.fillRect(bird.x, bird.y + bird.height / 2, bird.width, bird.height / 2);

      ctx.fillStyle = '#000000';
      ctx.fillRect(bird.x + 18, bird.y + 15, 8, 8);

      ctx.fillStyle = '#FF5733';
      ctx.beginPath();
      ctx.moveTo(bird.x + 40, bird.y + 15);
      ctx.lineTo(bird.x + 50, bird.y + 25);
      ctx.lineTo(bird.x + 40, bird.y + 35);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      drawBird();

      ctx.fillStyle = 'green';
      pipes.forEach(function (pipe) {
        ctx.fillRect(pipe.top.x, pipe.top.y, pipeWidth, pipe.top.height);
        ctx.fillRect(pipe.bottom.x, pipe.bottom.y, pipeWidth, pipe.bottom.height);
      });

      document.getElementById('score').textContent = `Score: ${score}`;
    }

    function update() {
      if (!gameOver) {
        if (frame % 60 === 0) createPipes();
        movePipes();
        updateBird();
        detectCollision();
        draw();
        frame++;
        requestAnimationFrame(update);
      } else {
        // Update high score if necessary
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('highScore', highScore);
        }

        document.getElementById('gameOver').innerHTML = `Game Over!<br>Score: ${score}<br>High Score: ${highScore}<br>Press Ctrl + R to Restart`;
      }
    }

    update();
  </script>
</body>
</html>
