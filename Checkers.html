<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
    font-family: sans-serif;
  }
  #info {
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: bold;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border: 2px solid #333;
  }
  .cell {
    width: 60px;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .black { background-color: #769656; }
  .white { background-color: #eeeed2; }
  .highlight-move { background-color: lightgreen !important; }
  .highlight-capture { background-color: orange !important; }
  .piece {
    width: 50px;
    height: 50px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .circle { border-radius: 50%; }
  .triangle {
    width: 0;
    height: 0;
    border-left: 25px solid transparent;
    border-right: 25px solid transparent;
    border-bottom: 50px solid;
  }
  .red.circle { background-color: red; }
  .red.triangle { border-bottom-color: red; }
  .black-piece.circle { background-color: black; }
  .black-piece.triangle { border-bottom-color: black; }
  .selected { outline: 3px solid yellow; }
</style>
</head>
<body>

<div id="info">Current Player: <span id="player">Red</span> | Turn: <span id="turn">1</span></div>
<div id="board"></div>

<script>
const board = document.getElementById('board');
const playerDisplay = document.getElementById('player');
const turnDisplay = document.getElementById('turn');

let selectedPiece = null;
let currentPlayer = 'red';
let highlightedCells = [];
let mustContinue = false;
let turn = 1;

let cells = [];
for (let row = 0; row < 8; row++) {
  cells[row] = [];
  for (let col = 0; col < 8; col++) {
    const cell = document.createElement('div');
    cell.classList.add('cell', (row + col) % 2 === 0 ? 'white' : 'black');
    cell.dataset.row = row;
    cell.dataset.col = col;
    cell.addEventListener('click', () => onCellClick(row, col));
    board.appendChild(cell);
    cells[row][col] = cell;
  }
}

// Place initial pieces
for (let row = 0; row < 3; row++)
  for (let col = 0; col < 8; col++)
    if ((row + col) % 2 !== 0) placePiece(row, col, 'black-piece');

for (let row = 5; row < 8; row++)
  for (let col = 0; col < 8; col++)
    if ((row + col) % 2 !== 0) placePiece(row, col, 'red');

function placePiece(row, col, color, isKing=false) {
  const piece = document.createElement('div');
  piece.classList.add('piece', color, isKing ? 'triangle' : 'circle');
  cells[row][col].appendChild(piece);
}

function promoteToKing(piece) {
  piece.classList.remove('circle');
  piece.classList.add('triangle');
}

function highlightMoves(cell) {
  clearHighlights();
  const piece = cell.querySelector('.piece');
  if (!piece) return;
  const row = parseInt(cell.dataset.row);
  const col = parseInt(cell.dataset.col);

  let directions = [[-1,-1],[-1,1],[1,-1],[1,1]];
  if (!piece.classList.contains('triangle')) {
    directions = piece.classList.contains('red') ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
  }

  const mustCapture = playerHasCaptures();

  directions.forEach(([dr, dc]) => {
    let r = row + dr;
    let c = col + dc;

    if(r>=0 && r<8 && c>=0 && c<8 && !cells[r][c].querySelector('.piece') && !mustCapture){
      cells[r][c].classList.add('highlight-move');
      highlightedCells.push(cells[r][c]);
    }

    const midR = row + dr;
    const midC = col + dc;
    const endR = row + dr*2;
    const endC = col + dc*2;
    if(endR>=0 && endR<8 && endC>=0 && endC<8){
      const midPiece = cells[midR][midC].querySelector('.piece');
      if(midPiece && !midPiece.classList.contains(currentPlayer) && !cells[endR][endC].querySelector('.piece')){
        cells[endR][endC].classList.add('highlight-capture');
        highlightedCells.push(cells[endR][endC]);
      }
    }

    if(piece.classList.contains('triangle')){
      r = row + dr; c = col + dc;
      let captured=false;
      while(r>=0 && r<8 && c>=0 && c<8){
        const target = cells[r][c].querySelector('.piece');
        if(!target && !captured && !mustCapture){
          cells[r][c].classList.add('highlight-move');
          highlightedCells.push(cells[r][c]);
        } else if(target && !target.classList.contains(currentPlayer) && !captured){
          captured=true;
        } else if(target && target.classList.contains(currentPlayer)) break;
        else if(captured && !target){
          cells[r][c].classList.add('highlight-capture');
          highlightedCells.push(cells[r][c]);
        }
        r+=dr;c+=dc;
      }
    }
  });
}

function clearHighlights() {
  highlightedCells.forEach(c => c.classList.remove('highlight-move','highlight-capture'));
  highlightedCells = [];
}

function onCellClick(row,col){
  const cell = cells[row][col];
  const piece = cell.querySelector('.piece');

  if(selectedPiece){
    if(highlightedCells.includes(cell)){
      const fromCell = selectedPiece.cell;
      const movingPiece = selectedPiece.piece;
      const capturedPieces = getCapturedPieces(fromCell,cell);
      capturedPieces.forEach(p => p.remove());
      cell.appendChild(movingPiece);
      movingPiece.classList.remove('selected');

      if((movingPiece.classList.contains('red') && row===0) || (movingPiece.classList.contains('black-piece') && row===7))
        promoteToKing(movingPiece);

      const moreCaptures = getPossibleCaptures(cell);
      if(capturedPieces.length>0 && moreCaptures.length>0){
        mustContinue=true;
        selectedPiece={piece:movingPiece, cell:cell};
        movingPiece.classList.add('selected');
        highlightMoves(cell);
        return;
      }

      mustContinue=false;
      selectedPiece=null;
      currentPlayer = currentPlayer==='red'?'black-piece':'red';
      turn++;
      updateDisplay();
      clearHighlights();
    } else {
      selectedPiece.piece.classList.remove('selected');
      selectedPiece=null;
      clearHighlights();
    }
  } else if(piece && piece.classList.contains(currentPlayer) && (!mustContinue || selectedPiece===null)){
    if(mustContinue && selectedPiece && piece!==selectedPiece.piece) return;
    selectedPiece={piece, cell};
    piece.classList.add('selected');
    highlightMoves(cell);
  }
}

function getCapturedPieces(fromCell, toCell){
  const fromRow=parseInt(fromCell.dataset.row);
  const fromCol=parseInt(fromCell.dataset.col);
  const toRow=parseInt(toCell.dataset.row);
  const toCol=parseInt(toCell.dataset.col);
  const movingPiece = fromCell.querySelector('.piece');
  const isKing = movingPiece.classList.contains('triangle');
  const captured=[];
  if(isKing){
    const stepRow = toRow>fromRow?1:-1;
    const stepCol = toCol>fromCol?1:-1;
    let r = fromRow + stepRow, c = fromCol + stepCol;
    while(r!==toRow && c!==toCol){
      const p=cells[r][c].querySelector('.piece');
      if(p && !p.classList.contains(currentPlayer)) captured.push(p);
      else if(p && p.classList.contains(currentPlayer)) return [];
      r+=stepRow; c+=stepCol;
    }
  } else {
    if(Math.abs(toRow-fromRow)===2 && Math.abs(toCol-fromCol)===2){
      const midR=(fromRow+toRow)/2, midC=(fromCol+toCol)/2;
      const midP=cells[midR][midC].querySelector('.piece');
      if(midP && !midP.classList.contains(currentPlayer)) captured.push(midP);
    }
  }
  return captured;
}

function getPossibleCaptures(cell){
  const row=parseInt(cell.dataset.row);
  const col=parseInt(cell.dataset.col);
  const piece=cell.querySelector('.piece');
  let directions=[[-1,-1],[-1,1],[1,-1],[1,1]];
  if(!piece.classList.contains('triangle')){
    directions = piece.classList.contains('red') ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
  }
  const captures=[];
  directions.forEach(([dr,dc])=>{
    const midR=row+dr, midC=col+dc, endR=row+2*dr, endC=col+2*dc;
    if(endR>=0 && endR<8 && endC>=0 && endC<8){
      const midPiece = cells[midR][midC].querySelector('.piece');
      const endCell = cells[endR][endC];
      if(midPiece && !midPiece.classList.contains(currentPlayer) && !endCell.querySelector('.piece')) captures.push(endCell);
    }
  });
  if(piece.classList.contains('triangle')){
    directions.forEach(([dr,dc])=>{
      let r=row+dr, c=col+dc;
      let captured=false;
      while(r>=0 && r<8 && c>=0 && c<8){
        const target=cells[r][c].querySelector('.piece');
        if(!target && !captured){}
        else if(target && !target.classList.contains(currentPlayer) && !captured) captured=true;
        else if(target && target.classList.contains(currentPlayer)) break;
        else if(captured && !target) captures.push(cells[r][c]);
        r+=dr;c+=dc;
      }
    });
  }
  return captures;
}

function playerHasCaptures(){
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const piece = cells[r][c].querySelector('.piece');
      if(piece && piece.classList.contains(currentPlayer)){
        if(getPossibleCaptures(cells[r][c]).length>0) return true;
      }
    }
  }
  return false;
}

function updateDisplay(){
  playerDisplay.textContent = currentPlayer==='red'?'Red':'Black';
  turnDisplay.textContent = turn;
}

updateDisplay();
</script>
</body>
</html>
